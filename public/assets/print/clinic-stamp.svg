<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" fill="none">
  <!-- Circular Clinic Stamp in Medical Violet/Blue -->
  <circle cx="70" cy="70" r="62" stroke="#4338CA" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.85" />
  <circle cx="70" cy="70" r="54" stroke="#4338CA" stroke-width="1.5" opacity="0.85" />
  
  <!-- Curved texts via path -->
  <path id="stampUpperCurve" d="M 24 70 A 46 46 0 0 1 116 70" fill="none" />
  <path id="stampLowerCurve" d="M 116 70 A 46 46 0 0 1 24 70" fill="none" />
  
  <text font-family="monospace, sans-serif" font-size="8.5" font-weight="bold" fill="#4338CA" opacity="0.85" letter-spacing="1.5">
    <textPath href="#stampUpperCurve" startOffset="50%" text-anchor="middle">
      ★ APEX MULTISPECIALITY ★
    </textPath>
  </text>
  <text font-family="monospace, sans-serif" font-size="8" font-weight="bold" fill="#4338CA" opacity="0.85" letter-spacing="1">
    <textPath href="#stampLowerCurve" startOffset="50%" text-anchor="middle">
      • CLINICALLY VALIDATED •
    </textPath>
  </text>
  
  <!-- Stamp Center -->
  <rect x="35" y="58" width="70" height="24" rx="4" stroke="#4338CA" stroke-width="1.2" fill="#EEF2FF" fill-opacity="0.4" />
  <text x="70" y="74" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#3730A3" text-anchor="middle" letter-spacing="1">
    VERIFIED
  </text>
</svg>
